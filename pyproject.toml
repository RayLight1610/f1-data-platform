[project]
name = "f1-data-platform"
version = "0.1.0"
description = "F1 Data Engineering platform — Bronze/Silver/Gold pipeline with FastF1 + PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastf1>=3.8.2",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_platform"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["notebooks", "cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
# Deliberately lenient: existing code has no annotations.
# Tighten (disallow_untyped_defs) when Silver introduces typed models.